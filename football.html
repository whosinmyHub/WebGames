<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick It!</title>

    <style>
        body {
            background-color: #77D524;
            display: flex;
            flex-direction: column;
        }
        h1 {
            position: fixed;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: #86F229;
            font-size: 70px;
            align-self: center;

            /* bottom: 78%;
            left: 40%; */
            /* transform: translate(-50%, -50%); */
            
        }
  
        #field {
            position: absolute;
            background-color: green;
            width: 1048px; /*89%;*/
            height: 400px;
            bottom: 35px;
            align-self: center;
            z-index: 20;
            border-left: 5px solid red;
            border-right: 5px solid red;
            border-bottom: 5px solid red;

        }
        #sky {
            position: absolute;
            background-color: lightblue;
            width: 1048px; /*89%;*/
            height: 160px;
            bottom: 427px;
            align-self: center;
            border-left: 5px solid red;
            border-right: 5px solid red;
            border-top: 5px solid red;

        }
        #goal {
            position: fixed;
            bottom: 440px; 
            /* 342px; */
            width: 400px;
            height: 440px;

            left: 150px;
            right: 0px;
            /* z-index: 100; */
        }
    </style>

</head>

<body>
    <h1>Kick It!</h1>
    <div id="field"></div>
    <div id="sky"></div>
    <img id="goal" src="/images/goal2.png">

    <script src="football.js"></script>
</body>

</html>
